:root{
  --canvas:#ECEAE6; --navy:#011F4A; --paper:#FFFFFF; --off:#D8D5CF;
  --navy-55:rgba(1,31,74,.55); --navy-40:rgba(1,31,74,.40); --navy-12:rgba(1,31,74,.12);
  --navy-06:rgba(1,31,74,.06); --hair:#E7E4DF; --white-60:rgba(255,255,255,.62);
  /* ink = primary/CTA states (button, loader, island, toast); card = content surfaces */
  --i-fg:#fff; --i-fg-60:rgba(255,255,255,.62); --i-fg-20:rgba(255,255,255,.2); --i-fg-18:rgba(255,255,255,.18); --i-fg-75:rgba(255,255,255,.75);
  --i-chip:#fff; --i-chip-fg:var(--navy);
  --c-fg:var(--navy); --c-fg-55:var(--navy-55); --c-fg-40:var(--navy-40); --c-fg-12:var(--navy-12); --c-fg-06:var(--navy-06);
  --c-on:#fff; --c-track:var(--off); --c-hair:var(--hair); --c-strip:#F1EFEB;
  --cur-fill:var(--navy); --cur-stroke:#fff;
}
:root[data-theme="navy"]{
  --canvas:#011F4A;
  --i-fg:var(--navy); --i-fg-60:rgba(1,31,74,.6); --i-fg-20:rgba(1,31,74,.16); --i-fg-18:rgba(1,31,74,.14); --i-fg-75:rgba(1,31,74,.8);
  --i-chip:var(--navy); --i-chip-fg:#fff;
  --c-fg:#fff; --c-fg-55:rgba(255,255,255,.62); --c-fg-40:rgba(255,255,255,.46); --c-fg-12:rgba(255,255,255,.18); --c-fg-06:rgba(255,255,255,.09);
  --c-on:var(--navy); --c-track:rgba(255,255,255,.2); --c-hair:rgba(255,255,255,.11); --c-strip:rgba(255,255,255,.08);
  --cur-fill:#fff; --cur-stroke:var(--navy);
}
html,body{margin:0;background:var(--canvas);overflow:hidden}
#frame{position:relative;width:1440px;height:1440px;background:var(--canvas);overflow:hidden;
  font-family:Geist,system-ui,sans-serif;color:var(--c-fg);-webkit-font-smoothing:antialiased}
#world{position:absolute;left:720px;top:720px;width:0;height:0;transform-origin:0 0}
#shape{position:absolute;left:0;top:0;overflow:hidden;transform-origin:50% 50%}
.layer{position:absolute;left:50%;top:50%;width:0;height:0}
.a{position:absolute;left:0;top:0;white-space:nowrap}
.mono{font-family:'Geist Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
svg{overflow:visible}
.ln{fill:none;stroke-linecap:round;stroke-linejoin:round}
#cursor{position:absolute;left:0;top:0;width:36px;height:45px;transform-origin:0 0}
</style>
</head>
<body>
<div id="frame">
  <div id="world">
    <div id="shape">
      <!-- 1 · button -->
      <div class="layer" id="Lbtn">
        <div class="a" id="btnLabel" style="font:500 24px/1 Geist;letter-spacing:-.01em;color:var(--i-fg)">Finalizar venda</div>
      </div>
      <!-- 2 · loader -->
      <div class="layer" id="Lload">
        <svg class="a" width="1" height="1"><circle cx="0" cy="0" r="20" class="ln" stroke="var(--i-fg-20)" stroke-width="2.5"/>
          <circle id="loadArc" cx="0" cy="0" r="20" class="ln" stroke="var(--i-fg)" stroke-width="2.5" pathLength="100"/></svg>
      </div>
      <!-- 3 · check -->
      <div class="layer" id="Lcheck">
        <svg class="a" width="1" height="1"><path id="heroCheck" d="M-12 1 L-4 9 L13 -8" class="ln" stroke="var(--i-fg)" stroke-width="2.7" pathLength="1"/></svg>
      </div>
      <!-- 4 · island -->
      <div class="layer" id="Lisland">
        <svg class="a" width="1" height="1" style="transform:translate(-150px,0)"><circle r="14" fill="var(--i-chip)"/>
          <path d="M-5.5 .5 L-1.8 4.2 L5.8 -3.8" class="ln" stroke="var(--i-chip-fg)" stroke-width="2.3"/></svg>
        <div class="a" style="transform:translate(-124px,-50%);font:500 19px/1 Geist;color:var(--i-fg);letter-spacing:-.01em">Venda aprovada</div>
        <div class="a mono" style="transform:translate(-100%,-50%) translateX(154px);font:400 16px/1 'Geist Mono';color:var(--i-fg-60)">R$ 86,40</div>
      </div>
      <!-- 5 · live activity -->
      <div class="layer" id="Llive">
        <div class="a" style="transform:translate(-184px,-24px);width:48px;height:48px;border-radius:12px;background:var(--i-chip)"></div>
        <svg class="a" width="1" height="1" style="transform:translate(-160px,0)"><circle r="12" class="ln" stroke="var(--i-chip-fg)" stroke-width="2.4"/><circle r="3" fill="var(--i-chip-fg)"/></svg>
        <div class="a" style="transform:translate(-124px,-21px);font:500 18px/1 Geist;color:var(--i-fg);letter-spacing:-.01em">Better Times</div>
        <div class="a" style="transform:translate(-124px,3px);font:400 15px/1 Geist;color:var(--i-fg-60)">Mixkit</div>
        <svg class="a" width="1" height="1" id="liveWave"></svg>
      </div>
      <!-- 6 · player -->
      <div class="layer" id="Lplayer">
        <div class="a" style="transform:translate(-202px,-107px);width:88px;height:88px;border-radius:18px;background:var(--c-fg)"></div>
        <svg class="a" width="1" height="1" style="transform:translate(-158px,-63px)"><circle r="22" class="ln" stroke="var(--c-on)" stroke-width="3"/><circle r="5" fill="var(--c-on)"/></svg>
        <div class="a" style="transform:translate(-94px,-96px);font:600 22px/1 Geist;letter-spacing:-.015em">Better Times are Coming</div>
        <div class="a" style="transform:translate(-94px,-66px);font:400 16px/1 Geist;color:var(--c-fg-55)">Mixkit · Synthpop</div>
        <svg class="a" width="1" height="1" id="plWave" style="transform:translate(180px,-80px)"></svg>
        <div class="a" style="transform:translate(-202px,17px);width:404px;height:6px;border-radius:3px;background:var(--c-track)"></div>
        <div class="a" id="plFill" style="transform:translate(-202px,17px);height:6px;border-radius:3px;background:var(--c-fg)"></div>
        <div class="a" id="plThumb" style="width:16px;height:16px;border-radius:50%;background:var(--c-fg)"></div>
        <div class="a mono" id="plCur" style="transform:translate(-202px,38px);font:400 14px/1 'Geist Mono';color:var(--c-fg-55)">0:42</div>
        <div class="a mono" style="transform:translate(-100%,0) translate(202px,38px);font:400 14px/1 'Geist Mono';color:var(--c-fg-55)">1:40</div>
        <svg class="a" width="1" height="1" style="transform:translate(-84px,96px)"><path d="M8 -9 L-4 0 L8 9 Z M-8 -9 H-5 V9 H-8 Z" fill="var(--c-fg)"/></svg>
        <svg class="a" width="1" height="1" style="transform:translate(84px,96px)"><path d="M-8 -9 L4 0 L-8 9 Z M5 -9 H8 V9 H5 Z" fill="var(--c-fg)"/></svg>
        <svg class="a" width="1" height="1" id="plBtn" style="transform:translate(0,96px)"><circle r="32" fill="var(--c-fg)"/>
          <path id="ppA" fill="var(--c-on)"/><path id="ppB" fill="var(--c-on)"/></svg>
      </div>
      <!-- 7 · volume -->
      <div class="layer" id="Lvol">
        <svg class="a" width="1" height="1" id="volIcon"><path d="M-9 -4 H-5 L1 -9 V9 L-5 4 H-9 Z" class="ln" stroke="var(--c-fg)" stroke-width="2.9"/>
          <path d="M5.5 -5 A7 7 0 0 1 5.5 5 M9 -8.5 A12 12 0 0 1 9 8.5" class="ln" stroke="var(--c-fg)" stroke-width="2.9"/></svg>
        <div class="a" id="volTrack" style="height:8px;border-radius:4px;background:var(--c-track)"></div>
        <div class="a" id="volFill" style="height:8px;border-radius:4px;background:var(--c-fg)"></div>
        <div class="a" id="volThumb" style="width:28px;height:28px;border-radius:50%;background:var(--c-fg)"></div>
        <div class="a mono" id="volPct" style="font:500 16px/1 'Geist Mono'">55%</div>
      </div>
      <!-- 8+9 · toggle knob → tab indicator (one element) -->
      <div class="layer" id="Lknob">
        <div id="tabGroup" class="a">
          <div class="a" id="tabStrip" style="transform:translate(-220px,-38px);width:440px;height:76px;border-radius:38px;background:var(--c-strip)"></div>
          <div class="a" id="knob"></div>
          <div class="a" id="tabBase" style="width:0;height:0"></div>
          <div class="a" id="tabTop" style="width:440px;height:76px;transform:translate(-220px,-38px)"></div>
        </div>
      </div>
