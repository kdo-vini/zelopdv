<!doctype html>
<html lang="pt-BR" class="%zelo.htmlclass%" data-surface="%zelo.surface%">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- <title> vem de cada rota via svelte:head; título estático aqui duplicaria a tag no SSR -->

    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <meta name="theme-color" content="#0ea5e9" />

    <!-- Default SEO — overridden per-route via <svelte:head> -->
    <meta name="robots" content="index, follow" />

    <!-- Open Graph (site-wide only — og:type/title/description/image/url vêm de cada rota via <SocialMeta> ou <svelte:head>, nunca aqui, para não duplicar a tag) -->
    <meta property="og:site_name" content="Zelo PDV" />
    <meta property="og:locale" content="pt_BR" />

    <!-- Twitter Card (default) -->
    <meta name="twitter:card" content="summary_large_image" />

    <noscript><img height="1" width="1" style="display:none"
    src="https://www.facebook.com/tr?id=904797296018757&ev=PageView&noscript=1"
    /></noscript>

    %zelo.head%
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <!-- Google Tag Manager (noscript) -->
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-TG5PPGLB"
    height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
    <!-- End Google Tag Manager (noscript) -->
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
