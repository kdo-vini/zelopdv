<!doctype html>
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- <title> vem de cada rota via svelte:head; título estático aqui duplicaria a tag no SSR -->

    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <meta name="theme-color" content="#0ea5e9" />

    <!-- Default SEO — overridden per-route via <svelte:head> -->
    <meta name="robots" content="index, follow" />

    <!-- Open Graph (default — individual pages should override og:title, og:description, og:url) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Zelo PDV" />
    <meta property="og:title" content="Zelo PDV — Sistema de Gestão para Pequenos Negócios" />
    <meta property="og:description" content="Frente de caixa ágil, controle de fiado e gestão financeira em um só lugar. Teste grátis por 14 dias, sem cartão." />
    <meta property="og:image" content="https://zelopdv.com.br/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="https://zelopdv.com.br" />
    <meta property="og:locale" content="pt_BR" />

    <!-- Twitter Card (default) -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Zelo PDV — Sistema de Gestão para Pequenos Negócios" />
    <meta name="twitter:description" content="Frente de caixa ágil, controle de fiado e gestão financeira em um só lugar. Teste grátis por 14 dias, sem cartão." />
    <meta name="twitter:image" content="https://zelopdv.com.br/og-image.png" />

    <noscript><img height="1" width="1" style="display:none"
    src="https://www.facebook.com/tr?id=904797296018757&ev=PageView&noscript=1"
    /></noscript>

    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <!-- Google Tag Manager (noscript) -->
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-TG5PPGLB"
    height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
    <!-- End Google Tag Manager (noscript) -->
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
