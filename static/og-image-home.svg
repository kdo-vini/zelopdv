<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Sua lanchonete vendeu bem. Mas sobrou dinheiro?</title>
  <desc id="desc">Zelo PDV mostra o lucro real da lanchonete em 14 dias grátis, sem cartão.</desc>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8" />
      <stop offset="1" stop-color="#0284c7" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#020617" flood-opacity="0.35" />
    </filter>
  </defs>

  <rect width="1200" height="630" fill="#0f172a" />
  <circle cx="1020" cy="80" r="260" fill="#0ea5e9" opacity="0.10" />
  <circle cx="1080" cy="560" r="220" fill="#0ea5e9" opacity="0.08" />

  <g transform="translate(72 60)">
    <rect width="52" height="52" rx="16" fill="url(#accent)" />
    <path d="M16 15h20v8H24v7h12v8H24v7h-8V15Z" fill="#fff" />
    <text x="68" y="35" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">Zelo PDV</text>
  </g>

  <g transform="translate(72 184)" font-family="Arial, Helvetica, sans-serif">
    <text x="0" y="0" fill="#7dd3fc" font-size="18" font-weight="700" letter-spacing="2">PDV PARA LANCHONETES</text>
    <text x="0" y="78" fill="#fff" font-size="58" font-weight="700">Sua lanchonete</text>
    <text x="0" y="145" fill="#fff" font-size="58" font-weight="700">vendeu bem.</text>
    <text x="0" y="212" fill="#fff" font-size="58" font-weight="700">Mas sobrou dinheiro?</text>
    <text x="0" y="270" fill="#bae6fd" font-size="34" font-weight="600">O Zelo te mostra.</text>
  </g>

  <g transform="translate(72 542)" font-family="Arial, Helvetica, sans-serif">
    <rect width="300" height="48" rx="24" fill="#0ea5e9" />
    <text x="24" y="31" fill="#fff" font-size="19" font-weight="700">14 dias grátis, sem cartão</text>
  </g>

  <g transform="translate(805 154)" filter="url(#shadow)" font-family="Arial, Helvetica, sans-serif">
    <rect width="315" height="330" rx="24" fill="#17233b" stroke="#334155" stroke-width="2" />
    <rect width="315" height="64" rx="24" fill="#111c31" />
    <rect y="42" width="315" height="22" fill="#111c31" />
    <circle cx="28" cy="32" r="14" fill="url(#accent)" />
    <text x="52" y="37" fill="#fff" font-size="18" font-weight="700">Zelinho</text>
    <circle cx="275" cy="32" r="5" fill="#38bdf8" />
    <text x="30" y="106" fill="#94a3b8" font-size="15">Pergunte ao seu caixa</text>
    <rect x="30" y="126" width="206" height="42" rx="14" fill="#0ea5e9" opacity="0.22" stroke="#38bdf8" stroke-opacity="0.35" />
    <text x="48" y="153" fill="#e0f2fe" font-size="15">Quanto sobrou hoje?</text>
    <rect x="30" y="194" width="255" height="86" rx="16" fill="#0f172a" stroke="#334155" />
    <text x="48" y="222" fill="#94a3b8" font-size="14">Vendas, despesas e fiado</text>
    <text x="48" y="254" fill="#fff" font-size="22" font-weight="700">Lucro real no seu caixa</text>
    <text x="30" y="309" fill="#7dd3fc" font-size="14" font-weight="700">Vendas em 3 toques</text>
  </g>
</svg>
